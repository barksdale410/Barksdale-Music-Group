<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BARKSDALE MUSIC STUDIO</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0b0d10;color:#e6edf3;font-family:system-ui,sans-serif;padding:16px;max-width:480px;margin:0 auto;padding-bottom:80px}
        h1{font-size:28px;font-weight:800}
        h1 span{background:linear-gradient(135deg,#f0883e,#e65c1a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{color:#8b949e;font-size:14px;border-left:3px solid #f0883e;padding-left:12px;margin-bottom:16px}
        .card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px;margin-bottom:16px}
        label{display:block;font-size:12px;color:#8b949e;margin:12px 0 4px;text-transform:uppercase;letter-spacing:0.3px}
        select,input{width:100%;padding:12px;background:#0d1117;border:1px solid #30363d;border-radius:10px;color:#e6edf3;font-size:15px;font-family:inherit}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        button{width:100%;padding:14px;background:linear-gradient(135deg,#238636,#2ea043);border:none;border-radius:10px;color:#fff;font-weight:600;font-size:16px;cursor:pointer;margin-top:12px;transition:all 0.2s}
        button:active{transform:scale(0.97);opacity:0.8}
        .btn-secondary{background:#21262d;border:1px solid #30363d}
        .btn-accent{background:linear-gradient(135deg,#f0883e,#e65c1a)}
        .output{background:#0d1117;border-radius:10px;padding:12px;font-family:monospace;font-size:12px;color:#8b949e;margin-top:12px;border:1px solid #21262d;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
        .hidden{display:none}
        .loading{display:none;text-align:center;padding:20px}
        .spinner{display:inline-block;width:28px;height:28px;border:3px solid #21262d;border-top:3px solid #f0883e;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .flex{display:flex;gap:10px;flex-wrap:wrap}
        .text-muted{color:#8b949e;font-size:13px}
    </style>
</head>
<body>
    <h1>🎵 <span>BARKSDALE</span> MUSIC STUDIO</h1>
    <p class="subtitle">Beat Maker for GarageBand, FL Studio, Logic, Ableton, BandLab</p>

    <div id="loading" class="loading"><div class="spinner"></div><p>Generating your beat...</p></div>

    <div class="card">
        <label>🎛️ Producer</label>
        <select id="producer"></select>

        <label>🎵 Genre</label>
        <select id="genre"></select>

        <label>🎭 Emotion</label>
        <select id="emotion"></select>

        <label>🎹 Chord Progression (ABC notation)</label>
        <input id="chords" type="text" placeholder="e.g. Cm, Ab, Fm, G" value="Cm, Ab, Fm, G">

        <div class="grid-2">
            <div><label>Tempo (BPM)</label><input id="tempo" type="number" value="78" min="60" max="200"></div>
            <div><label>Key</label><input id="key" type="text" value="C Minor"></div>
        </div>

        <button id="generateBtn">🎵 Generate Beat</button>

        <div id="output" class="output hidden"></div>

        <div id="downloadSection" class="hidden">
            <button id="downloadBtn" class="btn-accent">📥 Download MIDI ZIP (All DAWs)</button>
            <button id="copyBtn" class="btn-secondary" style="margin-top:8px;">📋 Copy Chord Line</button>
        </div>
    </div>

    <div class="card">
        <div style="display:flex;justify-content:space-between;color:#8b949e;font-size:13px;margin-bottom:8px;">
            <span>📂 SAVED BEATS</span>
            <span id="projectCount">0 projects</span>
        </div>
        <div id="projectList"><p class="text-muted text-center" style="padding:16px 0;">No saved beats yet.</p></div>
        <div class="flex">
            <button id="saveBtn" class="btn-secondary" style="flex:1;">💾 Save Beat</button>
            <button id="refreshBtn" class="btn-secondary" style="flex:1;">🔄 Refresh</button>
        </div>
    </div>

    <div style="text-align:center;color:#484f58;font-size:12px;margin-top:16px;">
        Works with GarageBand · FL Studio · FL Studio Mobile · Logic · Ableton · BandLab
    </div>

    <script>
        const API_BASE_URL = 'https://barksdale-music-group-7abg.onrender.com';
        console.log('✅ API URL:', API_BASE_URL);
        let currentBeatId = null;

        async function loadOptions() {
            try {
                const res = await fetch(API_BASE_URL + '/api/options');
                if (!res.ok) throw new Error('Failed to load options');
                const data = await res.json();
                const producerSel = document.getElementById('producer');
                data.producers.forEach(p => { const opt = document.createElement('option'); opt.value = p; opt.textContent = p; producerSel.appendChild(opt); });
                const genreSel = document.getElementById('genre');
                data.genres.forEach(g => { const opt = document.createElement('option'); opt.value = g; opt.textContent = g; genreSel.appendChild(opt); });
                const emotionSel = document.getElementById('emotion');
                data.emotions.forEach(e => { const opt = document.createElement('option'); opt.value = e; opt.textContent = e; emotionSel.appendChild(opt); });
            } catch (err) {
                console.error('Failed to load options:', err);
                alert('❌ Could not connect to backend. Please check your internet and try again.');
            }
        }
        loadOptions();

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            const payload = {
                producer: document.getElementById('producer').value,
                genre: document.getElementById('genre').value,
                emotion: document.getElementById('emotion').value,
                chords: document.getElementById('chords').value,
                tempo: parseInt(document.getElementById('tempo').value) || 78,
                key: document.getElementById('key').value
            };
            try {
                const res = await fetch(API_BASE_URL + '/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Generation failed');
                const data = await res.json();
                currentBeatId = data.id;
                const output = document.getElementById('output');
                output.classList.remove('hidden');
                output.innerHTML = `✅ <strong>Beat Generated!</strong><br>Producer: ${payload.producer}<br>Genre: ${payload.genre}<br>Emotion: ${payload.emotion}<br>Tempo: ${payload.tempo} BPM<br>Key: ${payload.key}<br><br><span class="text-muted">Chord Line:</span><br><code style="background:#0d1117;padding:4px 8px;border-radius:4px;display:block;margin-top:4px;">${data.chord_line}</code>`;
                document.getElementById('downloadSection').classList.remove('hidden');
                loadProjects();
            } catch (err) {
                const output = document.getElementById('output');
                output.classList.remove('hidden');
                output.textContent = '❌ Error: ' + err.message;
            } finally {
                loading.style.display = 'none';
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (currentBeatId) window.open(API_BASE_URL + '/api/download/' + currentBeatId, '_blank');
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const chords = document.getElementById('chords').value;
            navigator.clipboard.writeText(chords).then(() => alert('✅ Chord line copied to clipboard!')).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = chords;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('✅ Chord line copied to clipboard!');
            });
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            if (!currentBeatId) { alert('Please generate a beat first.'); return; }
            const name = prompt('Enter a name for this beat:', 'My Beat ' + new Date().toLocaleDateString());
            if (!name) return;
            const project = {
                id: currentBeatId,
                name: name,
                producer: document.getElementById('producer').value,
                genre: document.getElementById('genre').value,
                emotion: document.getElementById('emotion').value,
                chords: document.getElementById('chords').value,
                tempo: parseInt(document.getElementById('tempo').value),
                key: document.getElementById('key').value,
                created: new Date().toISOString()
            };
            let projects = JSON.parse(localStorage.getItem('barksdale_projects') || '[]');
            projects.push(project);
            localStorage.setItem('barksdale_projects', JSON.stringify(projects));
            loadProjects();
            alert('✅ Beat saved!');
        });

        function loadProjects() {
            const projects = JSON.parse(localStorage.getItem('barksdale_projects') || '[]');
            const container = document.getElementById('projectList');
            document.getElementById('projectCount').textContent = projects.length + ' projects';
            if (projects.length === 0) {
                container.innerHTML = '<p class="text-muted text-center" style="padding:16px 0;">No saved beats yet.</p>';
                return;
            }
            container.innerHTML = projects.map((p, i) => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #21262d;">
                    <div><strong>${p.name}</strong><span class="text-muted" style="font-size:12px;margin-left:8px;">${p.producer}</span><span class="text-muted" style="font-size:12px;margin-left:8px;">${p.chords}</span></div>
                    <div style="display:flex;gap:6px;">
                        <button class="btn-secondary" style="padding:4px 12px;font-size:12px;width:auto;" onclick="loadProject(${i})">📂</button>
                        <button class="btn-secondary" style="padding:4px 12px;font-size:12px;width:auto;background:#da3633;border-color:#da3633;" onclick="deleteProject(${i})">✕</button>
                    </div>
                </div>
            `).join('');
        }

        window.loadProject = function(i) {
            const projects = JSON.parse(localStorage.getItem('barksdale_projects') || '[]');
            const p = projects[i];
            document.getElementById('producer').value = p.producer;
            document.getElementById('genre').value = p.genre;
            document.getElementById('emotion').value = p.emotion;
            document.getElementById('chords').value = p.chords;
            document.getElementById('tempo').value = p.tempo;
            document.getElementById('key').value = p.key;
            currentBeatId = p.id;
            document.getElementById('output').classList.remove('hidden');
            document.getElementById('output').innerHTML = `✅ Loaded: ${p.name}`;
            document.getElementById('downloadSection').classList.remove('hidden');
            alert('✅ Beat loaded! Click Generate to re-create or Download to get the MIDI.');
        };

        window.deleteProject = function(i) {
            if (!confirm('Delete this beat?')) return;
            let projects = JSON.parse(localStorage.getItem('barksdale_projects') || '[]');
            projects.splice(i, 1);
            localStorage.setItem('barksdale_projects', JSON.stringify(projects));
            loadProjects();
        };

        document.getElementById('refreshBtn').addEventListener('click', loadProjects);
        loadProjects();
        console.log('🎵 BARKSDALE MUSIC STUDIO loaded.');
        console.log('🔗 Backend:', API_BASE_URL);
    </script>
</body>
</html>
